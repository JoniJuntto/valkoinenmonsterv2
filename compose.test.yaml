services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valkoinenmonster_test
      POSTGRES_PASSWORD: test
      POSTGRES_USER: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d valkoinenmonster_test"]
      interval: 1s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
